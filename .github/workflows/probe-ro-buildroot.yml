name: Probe read-only build root (fsdk-containers#332)
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    name: probe (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      BST_FLAGS: --config /src/ci/buildstream.conf
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Host facts
        run: |
          uname -a
          podman version || true
          sudo apt-get update && sudo apt-get install --yes fuse3 podman skopeo jq
          podman version
          mount | grep -E ' / | /home ' || true
          df -T "$HOME" /tmp
      - name: Container facts
        run: |
          just bst --version
          podman run --rm --privileged --device /dev/fuse registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d bash -c 'which buildbox-run buildbox-casd buildbox-fuse; buildbox-run --version; buildbox-casd --version; ls -l /dev/fuse; cat /proc/mounts'
      - name: Probe runtime-files.bst build sandbox
        run: |
          cat > /tmp/probe.sh <<'PROBE'
          set -x
          pwd; id
          cat /proc/mounts
          ls -la /buildstream-build
          ls -ld / /buildstream-build /buildstream-install /tmp 2>&1
          stat -f /buildstream-build
          touch /buildstream-build/probe-touch && echo TOUCH_OK
          echo hi > testpage.pdf && echo REDIRECT_OK; rm -f testpage.pdf
          mkdir /buildstream-build/probe-dir && echo MKDIR_OK
          gs -q -dSAFER -dBATCH -dNOPAUSE -sDEVICE=pdfwrite -sOutputFile=testpage.pdf testpage.ps && echo GS_SAFER_OK
          gs -q -dNOSAFER -dBATCH -dNOPAUSE -sDEVICE=pdfwrite -sOutputFile=testpage2.pdf testpage.ps && echo GS_NOSAFER_OK
          gs -q -dSAFER -dBATCH -dNOPAUSE -sDEVICE=pdfwrite -sOutputFile=/tmp/t.pdf testpage.ps && echo GS_TMP_OK
          ls -la /buildstream-build /tmp
          env | sort
          PROBE
          cp /tmp/probe.sh ./probe.sh
          just bst --network-retries 5 build --deps build printer-app/runtime-files.bst printer-app/application.bst
          just bst shell --build printer-app/runtime-files.bst -- sh /src/probe.sh
      - name: Probe application.bst build sandbox (control)
        if: always()
        run: |
          just bst shell --build printer-app/application.bst -- sh -c 'set -x; pwd; cat /proc/mounts; ls -ld /buildstream-build; touch /buildstream-build/probe && echo TOUCH_OK; gs -q -dSAFER -dBATCH -dNOPAUSE -sDEVICE=pdfwrite -sOutputFile=testpage.pdf testpage.ps && echo GS_SAFER_OK'
