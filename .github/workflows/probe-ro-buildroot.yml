name: Probe read-only build root (fsdk-containers#332)
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    name: probe (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      BST_FLAGS: --config /src/ci/buildstream.conf
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Host facts
        run: |
          uname -a
          podman version || true
          sudo apt-get update && sudo apt-get install --yes fuse3 podman skopeo jq
          podman version
          mount | grep -E ' / | /home ' || true
          df -T "$HOME" /tmp
      - name: Container facts
        run: |
          just bst --version
          podman run --rm --privileged --device /dev/fuse registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d bash -c 'which buildbox-run buildbox-casd buildbox-fuse; buildbox-run --version; buildbox-casd --version; ls -l /dev/fuse; cat /proc/mounts'
      - name: Build runtime-files.bst with in-sandbox probe
        run: just bst --network-retries 5 build printer-app/runtime-files.bst
      - name: Show probe build log
        if: always()
        run: |
          for f in $(sudo find ~/.cache/buildstream/logs -path '*runtime-files*' -name '*-build.*.log'); do echo "##### $f"; sudo cat "$f"; done
